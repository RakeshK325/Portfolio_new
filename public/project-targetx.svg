  <circle cx="1235" cy="375" r="52" fill="#B6A2FF" fill-opacity=".09" stroke="#B6A2FF" stroke-width="3"/><circle cx="1235" cy="375" r="27" fill="none" stroke="#B6A2FF" stroke-width="3"/><circle cx="1235" cy="375" r="7" fill="#B6A2FF" filter="url(#glow)"/><path d="M1235 300v150M1160 375h150" stroke="#B6A2FF" stroke-opacity=".32" stroke-dasharray="6 10"/>
  <text x="210" y="110" fill="#fff" fill-opacity=".42" font-family="monospace" font-size="20" letter-spacing="7">GUIDE-RNA RANKING ENGINE / 03</text>
