<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Target-X CRISPR analysis illustration</title>
  <desc id="desc">An abstract dark bioinformatics interface with a DNA helix, guide-RNA scoring lanes, and a target marker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171326"/><stop offset="1" stop-color="#07080d"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B6A2FF"/><stop offset="1" stop-color="#8AB4FF"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g stroke="#B6A2FF" stroke-opacity=".08"><path d="M0 180H1600M0 820H1600M200 0V1000M1400 0V1000"/><path d="M0 500H1600" stroke-dasharray="4 12"/></g>
