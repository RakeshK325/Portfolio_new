  <rect x="300" y="223" width="260" height="18" rx="9" fill="#fff" fill-opacity=".55"/><rect x="1100" y="223" width="120" height="26" rx="13" fill="#B6A2FF" fill-opacity=".14" stroke="#B6A2FF" stroke-opacity=".7"/><rect x="1240" y="223" width="110" height="26" rx="13" fill="#fff" fill-opacity=".06"/>
  <g transform="translate(270 335)" fill="none" stroke="url(#violet)" stroke-width="6" stroke-linecap="round"><path d="M0 0c180 45 180 185 0 230s-180 185 0 230"/><path d="M150 0c-180 45-180 185 0 230s180 185 0 230"/><path d="M28 34h94M18 104h112M18 176h112M28 248h94M18 320h112M18 392h112" stroke-width="4" stroke-opacity=".7"/></g>
