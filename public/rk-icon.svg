<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RK initials logo</title>
  <desc id="desc">A dark rounded square with the white initials RK and a cyan accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17232b"/>
      <stop offset="0.62" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#07151c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#5ee7f2" stroke-opacity="0.34" stroke-width="4"/>
  <text x="256" y="302" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="800" letter-spacing="-12" text-anchor="middle">RK</text>
</svg>
