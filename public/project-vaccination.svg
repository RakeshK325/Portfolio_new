<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pediatric vaccination management illustration</title>
  <desc id="desc">An abstract dark schedule interface with two vaccination lanes, milestone nodes, and a smart availability panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08161b"/><stop offset="1" stop-color="#07090d"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7DE3E3"/><stop offset="1" stop-color="#A6F0C6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g stroke="#7DE3E3" stroke-opacity=".08"><path d="M0 175H1600M0 825H1600M200 0V1000M1400 0V1000"/><path d="M0 500H1600" stroke-dasharray="5 14"/></g>
